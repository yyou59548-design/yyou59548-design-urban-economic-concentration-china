name: Core replication tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - run: python scripts/verify_manifest.py
      - run: python tests/run_table_contract_tests.py
      - run: python tests/run_core_checks.py
      - name: Repeat core verification for run-to-run stability
        run: python tests/run_core_checks.py
      - run: python tests/run_independent_oracles.py
      - run: python tests/run_integrity_negative_tests.py
